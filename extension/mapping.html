<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>nashmeet — map speakers</title>
  <style>
    :root {
      --brand: #1ac970; --brand-ink: #12a75b; --brand-deep: #0e8f4d;
      --brand-tint: rgba(26,201,112,0.14);
      --ink: #1c2024; --muted: #6b7280; --line: #e3e6ea; --red: #c0392b;
    }
    * { box-sizing: border-box; }
    body { font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           max-width: 720px; margin: 40px auto; padding: 0 20px 60px; color: var(--ink);
           -webkit-font-smoothing: antialiased; }
    h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
    #phase { color: var(--muted); margin: 0 0 20px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 14px 0;
            background: #fff; }
    .card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; display: flex; gap: 9px;
               align-items: center; letter-spacing: -0.01em; }
    .chip { font-size: 11px; font-weight: 600; background: #eef1f5; border-radius: 999px;
            padding: 3px 9px; color: #5b6470; letter-spacing: 0.01em; }
    .chip.mic { background: var(--brand-tint); color: var(--brand-deep); }
    .utt { color: #4a4f55; font-size: 13px; margin: 6px 0; display: flex; gap: 10px; align-items: center; }
    .utt button { flex: none; width: 28px; height: 28px; display: grid; place-items: center;
                  font-size: 10px; cursor: pointer; border-radius: 50%; color: var(--brand-deep);
                  border: 1px solid var(--brand-tint); background: var(--brand-tint); padding: 0;
                  transition: background 0.12s, transform 0.08s; }
    .utt button:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
    .utt button:active { transform: scale(0.92); }
    .utt span { line-height: 1.45; }
    input[type="text"] { width: 260px; padding: 9px 11px; border: 1px solid var(--line);
                         border-radius: 8px; font: inherit; vertical-align: middle; }
    input[type="text"]:focus { outline: none; border-color: var(--brand);
                               box-shadow: 0 0 0 3px var(--brand-tint); }
    .cand { display: inline-block; font-size: 12.5px; margin: 0 0 0 8px; cursor: pointer;
            color: var(--brand-deep); font-weight: 600; padding: 5px 11px; border-radius: 999px;
            border: 1px solid var(--brand-tint); background: #fff; vertical-align: middle;
            transition: background 0.12s, border-color 0.12s; }
    .cand:hover { background: var(--brand-tint); border-color: var(--brand); }
    .chips { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 7px; }
    .chips:empty { display: none; }
    .card.context { background: #fbfdfc; border-color: var(--brand-tint); }
    .card.context label { display: block; font-size: 12.5px; font-weight: 600;
                          color: var(--muted); margin: 12px 0 5px; }
    .card.context label:first-of-type { margin-top: 0; }
    .card.context input[type="text"] { width: 100%; }
    .card.context .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    #actions { margin: 24px 0; display: flex; gap: 10px; }
    button.big { padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
                 border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
    button.big:hover { border-color: #cfd4db; }
    button.primary { background: var(--brand); color: #fff; border-color: var(--brand-ink); }
    button.primary:hover { background: var(--brand-ink); border-color: var(--brand-deep); }
    button.big:active { transform: translateY(0.5px); }
    #result { white-space: pre-wrap; background: #f6f7f9; border: 1px solid var(--line);
              border-radius: 9px; padding: 12px 14px; font-size: 13px; color: #3a3f45; }
    .error { color: var(--red); }
  </style>
</head>
<body>
  <h1>nashmeet — map speakers</h1>
  <p id="phase">loading session…</p>
  <div id="context"></div>
  <div id="cards"></div>
  <div id="actions" style="display:none">
    <button class="big primary" id="confirm">Confirm &amp; file transcript</button>
    <button class="big" id="skip">Skip — file with Speaker 1/2 labels</button>
  </div>
  <div id="result"></div>
  <script type="module" src="mapping.js"></script>
</body>
</html>
