[package]
name = "nashgit-cli"
version = "0.1.0"
edition = "2024"
description = "Deploy and operate a self-hosted dgit git server on celld, over your own tailnet."
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "nashgit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password", "fuzzy-select"] }
dirs = "6.0.0"
rand = "0.10.2"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
