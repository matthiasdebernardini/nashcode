[package]
name = "nashcode-cli"
version = "0.1.0"
edition = "2024"
description = "Deploy and operate a self-hosted dgit git server on celld, over your own tailnet."
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "nashcode"
path = "src/main.rs"

[dependencies]
agcli = "0.17"
anyhow = "1.0.104"
base64 = "0.23.1"
dgit-index = { path = "../dgit-index" }
dirs = "6.0.0"
globset = "0.4"
# The people.json model, its validation, and the routing rule, shared with the viewer
# and the desktop app. `client` adds the push and the last-push question.
people-core = { path = "../people-core", features = ["client"] }
rand = "0.10.2"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
