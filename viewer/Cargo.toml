[package]
name = "nashcode"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Stacked-branch review and CI for a dgit server on a tailnet"

# The user-facing `nashcode` binary belongs to the cli crate; the viewer's
# server binary carries its own name. The lib target stays `nashcode`, which is
# what the integration tests import.
[[bin]]
name = "nashcode-viewer"
path = "src/main.rs"

[features]
default = ["embeddings"]
# Semantic code search. On by default: with `ort-load-dynamic` the ONNX Runtime is
# opened at run time rather than linked in, so this feature costs the release build
# nothing and a box without the shared library degrades instead of failing to link.
embeddings = ["dep:fastembed"]
# The drain's iroh transport. Off by default: it pulls in the whole QUIC stack, and it
# has never talked to a live `iroh-ingress` — there is not one to talk to outside the
# VPS, and nothing here fakes one. The TCP transport is complete and tested without it.
# Turn it on for the VPS build, watch one drain land, then make it default.
drain-iroh = ["dep:iroh", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "tokio/io-util"]

[dependencies]
topcoat = "0.6"
# dgit's index page is the repo list. One parser, shared with the CLI's `nashcode ls`.
dgit-index = { path = "../dgit-index" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
base64 = "0.22"
include_dir = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
serde_yaml_bw = "2.5.7"
serde_urlencoded = "0.7"
tempfile = "3"
# `.nashcode/stack.toml` and the clone URLs it declares. Both were already in the
# tree as transitive dependencies, so naming them here costs no extra build.
toml = "1"
url = "2"

# Code intelligence. tree-sitter and its grammars are plain C and cross-compile
# with the rest of the tree; `scip` reads the accurate overlay the language
# indexers emit; `fastembed` is optional (see the `embeddings` feature).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
scip = "0.9"
protobuf = "3.7"
fastembed = { version = "6", default-features = false, features = [
    "ort-load-dynamic",
    "hf-hub-rustls-tls",
], optional = true }
sentry-types = "0.49"
# Dogfooding: nashcode reports its own errors to nashcode, through the ordinary door.
# `default-features = false` drops `debug-images`, `metrics`, `release-health` and the
# native-tls transport; rustls is what the rest of the tree already speaks.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "logs",
    "reqwest",
    "rustls",
] }
sentry-tracing = { version = "0.49", features = ["logs"] }
flate2 = "1"
brotli-decompressor = "5"
# Cron monitors. `croner` parses the 5-field Vixie schedules an SDK sends in a
# `monitor_config` and answers "when is the next one". Its whole API speaks
# `chrono::DateTime`, so chrono is not a choice — it is croner's alphabet — and
# `chrono-tz` is what makes a monitor scheduled `0 9 * * *` in America/Chicago mean
# nine in Chicago. Storage stays on `time`, the way the rest of the tree does; chrono
# is confined to the schedule arithmetic in `bugs::crons`.
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
regex = "1"
object_store = { version = "0.14", features = ["aws"] }
futures-core = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
globset = "0.4"

# The drain's iroh transport (feature `drain-iroh`): dial the ingester's EndpointId on
# ALPN `celld/http/0` and speak HTTP/1 over one QUIC stream. hyper is the h1 client,
# hyper-util the adapter between tokio's IO traits and hyper's. Off by default until it
# has talked to a live iroh-ingress once — see NOTES.
iroh = { version = "1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
brotli = "8.0.4"
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
