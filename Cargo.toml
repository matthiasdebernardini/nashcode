[workspace]
resolver = "3"
members = ["viewer", "cli", "dgit-index", "people-core", "people"]
# Vendored third-party source, patched in below. It is not a member: nothing here
# builds or tests it, and `cargo test --workspace` should not try.
exclude = ["vendor/arrayref"]

# Upstream breakage, not a choice: gpui-ce -> resvg -> tiny-skia needs arrayref ^0.3.6,
# but crates.io has 0.3.5-0.3.9 yanked and 0.3.10 depends on `proc-macro1`, which was
# removed from the registry. Nothing in that range resolves. Patch in the clean 0.3.9 source.
[patch.crates-io]
arrayref = { path = "vendor/arrayref" }
